{% extends 'admin/base_admin.html' %}
{% block title %}{% if user %}Редактировать{% else %}Новый пользователь{% endif %} — Администрация{% endblock %}

{% block admin_content %}
<div class="admin-page-header">
  <h1>
    <i class="fa-solid fa-{% if user %}user-pen{% else %}user-plus{% endif %}"></i>
    {% if user %}Редактировать пользователя{% else %}Новый пользователь{% endif %}
  </h1>
  <a href="{{ url_for('admin_users') }}" class="btn btn-outline">
    <i class="fa-solid fa-arrow-left"></i> К списку
  </a>
</div>

<div class="admin-form-wrap">
  <form method="post" class="admin-form">
    <div class="form-group">
      <label for="username">Имя пользователя *</label>
      <input type="text" id="username" name="username" required
             value="{{ user.username if user else '' }}">
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required
             value="{{ user.email if user else '' }}">
    </div>
    <div class="form-group">
      <label for="password">Пароль {% if user %}<small>(оставьте пустым, чтобы не менять)</small>{% else %}*{% endif %}</label>
      <input type="password" id="password" name="password"
             {% if not user %}required{% endif %} placeholder="Пароль">
    </div>
    <div class="form-group">
      <label for="role">Роль *</label>
      <select id="role" name="role" required>
        <option value="user"  {% if user and user.role == 'user'  %}selected{% endif %}>Клиент</option>
        <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Администратор</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-floppy-disk"></i>
        {% if user %}Сохранить{% else %}Создать{% endif %}
      </button>
      <a href="{{ url_for('admin_users') }}" class="btn btn-outline">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
