{% extends 'base.html' %}
{% block title %}Регистрация — ФинансБанк{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Открыть счёт</h1>
        <p>Создайте личный кабинет ФинансБанка</p>
      </div>
      <form method="post" class="auth-form">
        <div class="form-group">
          <label for="username">Имя пользователя *</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="Выберите логин" value="{{ request.form.get('username', '') }}">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="email" required
                   placeholder="your@email.ru" value="{{ request.form.get('email', '') }}">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Пароль * <small>(мин. 6 символов)</small></label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" required placeholder="Придумайте пароль">
          </div>
        </div>
        <div class="form-group">
          <label for="confirm">Повторите пароль *</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirm" name="confirm" required placeholder="Повторите пароль">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-user-plus"></i> Зарегистрироваться
        </button>
      </form>
      <div class="auth-footer">
        <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
